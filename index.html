<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="description" content="Cube Game — destroy the cube from orbit" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Cube Game</title>
    <style>
      /* Critical paint: prevent white flash / portrait layout jump */
      html, body { background: #000; margin: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body class="game-body">
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root">
        <div id="hud-root"></div>
        <div id="menu-root"></div>
        <div id="tech-tree-root" class="panel-hidden"></div>
        <div id="level-select-root" class="panel-hidden"></div>
        <div id="loadout-root" class="panel-hidden"></div>
        <div id="ads-root" class="panel-hidden"></div>
        <div id="overlay-root"></div>
      </div>
      <div id="scanlines" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
